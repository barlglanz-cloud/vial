<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Record — NYC violation lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181C; --paper:#EFF0F2; --card:#FFFFFF; --rule:#C9CCD1;
    --permit:#E5006D; --permit-soft:#FFF0F6;
    --class1:#C81E1E; --class2:#B26A00; --class3:#5B6068; --ok:#15704A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* faint blueprint grid */
    background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
  }
  body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.86;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 20px 90px}

  /* ---------- hero ---------- */
  .hero{padding:min(16vh,120px) 0 0;transition:padding .35s ease}
  body.has-result .hero{padding:26px 0 0}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7A7F87;margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--permit)}

  .hero h1{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.01em;line-height:.92;margin:0;
    font-size:clamp(42px,9vw,86px);
  }
  .hero h1 em{font-style:normal;color:var(--permit)}
  .hero .lede{
    max-width:52ch;margin:18px 0 0;font-size:14px;color:#4A4F57;
  }
  body.has-result .hero h1{font-size:clamp(24px,4vw,32px)}
  body.has-result .hero .lede,
  body.has-result .hero .eyebrow,
  body.has-result .searchmsg:empty,

  /* ---------- the placard: search ---------- */
  .placard{margin:34px 0 0;border:2px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 rgba(22,24,28,.10)}
  body.has-result .placard{margin-top:20px;box-shadow:none}
  .placard .strip{
    background:var(--permit);color:#fff;padding:7px 14px;
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .placard .strip span:last-child{opacity:.8}

  .field{display:flex;align-items:center;gap:14px;padding:4px 6px 4px 18px}
  .field svg{flex:none;color:#9AA0A8}
  .field:focus-within svg{color:var(--permit)}
  input{
    flex:1;min-width:0;width:100%;padding:20px 0;font:inherit;font-size:17px;letter-spacing:.01em;
    background:transparent;border:0;color:var(--ink);
  }
  .go{
    flex:none;font-family:'Archivo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;padding:14px 22px;margin:0;cursor:pointer;
    background:var(--ink);color:#fff;border:0;
  }
  .go:hover,.go:focus{background:var(--permit);outline:none}
  .go:disabled{background:var(--rule);color:#8A8F97;cursor:default}
  @media (max-width:520px){
    .field{flex-wrap:wrap;padding:4px 6px 6px 14px}
    input{padding:14px 0}
    .go{width:100%;padding:13px}
  }
  input::placeholder{color:#A9AEB5}
  input:focus{outline:none}
  .field{border-top:2px solid transparent}
  .placard:focus-within{box-shadow:6px 6px 0 var(--permit)}
  body.has-result .placard:focus-within{box-shadow:4px 4px 0 var(--permit)}
  .spinner{width:15px;height:15px;border:2px solid var(--rule);border-top-color:var(--permit);border-radius:50%;
           animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- suggestions ---------- */
  .suggest{border-top:1.5px solid var(--ink);max-height:330px;overflow:auto}
  .suggest[hidden]{display:none}
  .suggest button{
    display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
    padding:12px 18px;font:inherit;background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer;
  }
  .suggest button:last-child{border-bottom:0}
  .suggest button .no{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;min-width:56px}
  .suggest button .rest{flex:1;color:#4A4F57}
  .suggest button .boro{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9AA0A8}
  .suggest button[aria-selected="true"]{background:var(--permit);color:#fff}
  .suggest button[aria-selected="true"] .rest,
  .suggest button[aria-selected="true"] .boro{color:#FFD9EA}

  /* ---------- saved buildings as its own page ---------- */
  body.view-saved .hero,
  body.view-record .hero{display:none}
  body.view-saved #openSaved{display:none}
  body.view-saved .wrap,
  body.view-record .wrap{padding-top:0}
  .navbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .backbtn{margin-bottom:18px}

  /* ---------- inline search feedback ---------- */
  .searchtools{display:flex;justify-content:flex-end;margin-top:10px}
  .clear{
    font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:7px;padding:6px 11px;cursor:pointer;
    background:none;border:1px solid var(--rule);color:#8A8F97;
  }
  .clear::before{content:"✕";font-size:11px;letter-spacing:0}
  .clear:hover,.clear:focus{border-color:var(--permit);color:var(--permit);outline:none}
  .clear:disabled{opacity:.4;cursor:default;border-color:var(--rule);color:#B4B8BE}
  .searchmsg{margin-top:12px;border:1.5px solid var(--class2);background:#FFF8EC;color:#7A5300;
             padding:12px 14px;font-size:13px;line-height:1.6}
  .searchmsg[hidden]{display:none}
  .searchmsg strong{display:block}
  .searchmsg .reason{display:block;color:#9A7430;font-size:12px;margin:2px 0 10px}

  /* ---------- results ---------- */
  .building{background:var(--card);border:2px solid var(--ink);padding:16px 18px;margin:26px 0 0}
  .building h2{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:22px;margin:0 0 10px}
  .ids{display:flex;flex-wrap:wrap;gap:18px;font-size:12px}
  .ids b{display:block;font-size:10px;letter-spacing:.12em;color:#8A8F97;font-weight:500}

  .tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .tile{background:var(--card);border:2px solid var(--ink);padding:12px 14px}
  .tile .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:32px;line-height:1}
  .tile .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8A8F97;margin-top:4px}

  h3.section{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:15px;
             margin:32px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink);
             display:flex;justify-content:space-between;align-items:baseline}
  h3.section span{font-family:'IBM Plex Mono';font-size:11px;color:#8A8F97;letter-spacing:0}

  .row{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--class3);padding:11px 14px;margin-bottom:6px}
  .row.c1{border-left-color:var(--class1)}
  .row.c2{border-left-color:var(--class2)}
  .row.open{border-left-width:8px}
  .row .top{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;font-size:12px}
  .row .num{font-weight:600}
  .row .desc{margin-top:5px;font-size:13px}
  .pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor}
  .pill.open{color:var(--class1)}
  .pill.closed{color:var(--ok)}
  .muted{color:#8A8F97}

  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  a.dob,button.dob{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 9px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);
    text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  a.dob:hover,button.dob:hover,a.dob:focus,button.dob:focus{background:var(--permit);border-color:var(--permit);color:#fff;outline:none}
  a.dob::after{content:"↗";font-size:12px}
  button.dob.copied{background:var(--ok);border-color:var(--ok);color:#fff}
  .actions .why{font-size:11px;color:#9AA0A8;text-transform:none;letter-spacing:0}
  .building .actions{margin-top:14px}

  /* ---------- top bar + saved folder ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
          padding:14px 0 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  .topbar .mark{color:#9AA0A8;cursor:pointer;background:none;border:0;font:inherit;letter-spacing:.18em;padding:0}
  .topbar .mark:hover{color:var(--permit)}
  .savedbtn{font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;
    background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
  .savedbtn:hover,.savedbtn:focus{border-color:var(--permit);color:var(--permit);outline:none}
  .savedbtn .badge{background:var(--permit);color:#fff;padding:1px 6px;font-family:'Archivo',sans-serif;
                   font-weight:800;letter-spacing:0;font-size:11px}
  .savedbtn .badge[data-n="0"]{background:var(--rule);color:#6B7078}

  button.save{border-color:var(--ink)}
  button.save.on{background:var(--permit);border-color:var(--permit);color:#fff}
  button.save::after{content:none}

  .folder{margin-top:26px}
  .folder .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
                border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
  .folder h2{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:24px;margin:0}
  .saved-item{display:flex;align-items:center;gap:12px;background:var(--card);
              border:1px solid var(--rule);border-left:5px solid var(--permit);padding:12px 14px;margin-bottom:6px}
  .saved-item .open{flex:1;text-align:left;font:inherit;background:none;border:0;cursor:pointer;padding:0}
  .saved-item .open:hover .addr,.saved-item .open:focus .addr{color:var(--permit);outline:none}
  .saved-item .addr{font-weight:600;font-size:15px;display:block}
  .saved-item .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9AA0A8}
  .saved-item .drop{font:inherit;font-size:16px;line-height:1;background:none;border:0;cursor:pointer;
                    color:#B4B8BE;padding:4px 6px}
  .saved-item .drop:hover,.saved-item .drop:focus{color:var(--class1);outline:none}

  .empty.warn{border-color:var(--class2);border-style:solid;border-left-width:4px;color:#7A5300;background:#FFF8EC}
  #fatal{display:none;background:var(--class1);color:#fff;padding:12px 16px;font-size:13px;line-height:1.6;margin-top:14px}

  .bfacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .bfacts:empty{display:none}
  .bfact{border:1px solid var(--rule);padding:8px 12px;min-width:88px;background:var(--paper)}
  .bfact.wide{min-width:150px}
  .bfact-v{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;line-height:1.1}
  .bfact-k{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8A8F97;margin-top:3px}
  .bfact-s{display:block;font-size:10px;color:#6B7078;margin-top:2px}

  .owner{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--class3);
         padding:11px 14px;margin-bottom:6px}
  .owner.lot{border-left-color:var(--permit)}
  .owner-top{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
  .owner-name{font-weight:600;font-size:14px}
  .owner-role{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8A8F97}
  .owner-addr{font-size:12.5px;margin-top:4px;color:#4A4F57}

  .alertdot{background:var(--permit);color:#fff;padding:1px 6px;font-family:'Archivo',sans-serif;
            font-weight:800;letter-spacing:0;font-size:10px;margin-left:8px}
  .savedbtn.alerting{border-color:var(--permit)}
  .saved-item.changed{border-left-color:var(--permit);border-left-width:8px}
  .changepill{display:inline-block;background:var(--permit);color:#fff;font-size:10px;
              letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;margin:4px 0 0}
  .changebanner{background:#FFF0F6;border:2px solid var(--permit);padding:12px 14px;margin:0 0 14px;
                display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .changebanner strong{font-size:13px}
  .changebanner span{font-size:12px;color:#8A3060;flex:1}
  .flag{font-family:'Archivo',sans-serif;font-weight:800;font-size:9px;letter-spacing:.1em;
        text-transform:uppercase;padding:2px 6px;color:#fff;background:var(--permit)}
  .flag.done{background:var(--ok)}

  .sortbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
  .sortlab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8A8F97}
  .sortsel{font:inherit;font-size:12px;padding:7px 10px;background:var(--card);
           border:1.5px solid var(--ink);color:var(--ink);border-radius:0;cursor:pointer}
  .sortsel:focus{outline:none;box-shadow:3px 3px 0 var(--permit)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .fchip{font:inherit;font-size:11px;letter-spacing:.06em;padding:6px 10px;cursor:pointer;
         background:var(--card);border:1px solid var(--rule);color:#6B7078}
  .fchip:hover,.fchip:focus{border-color:var(--permit);color:var(--permit);outline:none}
  .fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .viewbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
           border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
           padding:8px 0;margin:0 0 12px}
  .viewbar.active{border-color:var(--permit);background:#FFF7FB}
  .viewdesc{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B7078}
  .viewbar.active .viewdesc{color:var(--permit)}
  .clearview{font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
             background:none;border:1px solid var(--permit);color:var(--permit);
             padding:5px 10px;cursor:pointer}
  .clearview:hover,.clearview:focus{background:var(--permit);color:#fff;outline:none}
  .saved-item .sub.dim{color:#B4B8BE}
  .kind{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:1px 5px;
        border:1px solid currentColor;color:#8A8F97}
  .kind.person{color:#15704A}
  .kind.company{color:#8A3060}
  .kind.public{color:#5B6068}
  .ownergroup{margin-bottom:18px}
  .ownerhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
             border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:6px}
  .ownerhead-name{font-family:'Archivo Narrow',sans-serif;font-weight:700;text-transform:uppercase;
                  letter-spacing:.04em;font-size:14px}
  .ownerhead-n{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8A8F97}

  .status{margin-top:24px;font-size:12px;color:#8A8F97;line-height:1.7}
  .empty{background:var(--card);border:1px dashed var(--rule);padding:14px;font-size:13px;color:#666}
  .note{font-size:12px;color:#8A8F97;margin-top:10px}
  .warn{border-left:4px solid var(--class2);padding-left:10px}
  .loading{margin-top:26px;border:2px solid var(--ink);background:var(--card);padding:16px 18px}
  .bar{height:4px;background:var(--rule);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:35%;background:var(--permit);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}

  @media (prefers-reduced-motion:reduce){
    .bar i,.spinner{animation:none}
    .hero{transition:none}
  }
  @media (prefers-reduced-motion:no-preference){
    .row{animation:in .18s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(3px)}}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="fatal" role="alert"></div>

  <div class="topbar">
    <button class="mark" id="goHome">Building Record</button>
    <button class="savedbtn" id="openSaved">Saved buildings <span class="badge" id="savedCount" data-n="0">0</span></button>
  </div>

  <div class="hero">
    <div class="eyebrow">NYC Open Data · Department of Buildings</div>
    <h1>Look up any<br>building's <em>violations</em></h1>
    <p class="lede">Type an address. You get every DOB violation, safety violation and OATH/ECB
      summons on file for that building — with a link straight to the record on the city's own site.</p>

    <div class="placard">
      <div class="strip">
        <span>Public record lookup</span>
        <span>BIS · DOB NOW · OATH</span>
      </div>
      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path>
        </svg>
        <input id="q" type="text" autocomplete="off" spellcheck="false"
               placeholder="Enter a full address, e.g. 20 Exchange Place"
               aria-label="Building address"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <div id="busy" hidden class="spinner" aria-hidden="true"></div>
        <button class="go" id="go">Search</button>
      </div>
      <div id="suggest" class="suggest" role="listbox" aria-label="Matching addresses" hidden></div>
    </div>

    <div class="searchtools">
      <button class="clear" id="clearSearch">Clear search</button>
    </div>

    <div id="searchMsg" class="searchmsg" role="status" hidden></div>
  </div>

  <div id="out"></div>

</div>

<script>
// ---------------------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------------------
// Free Socrata app token: https://data.cityofnewyork.us/profile/edit/developer_settings
const APP_TOKEN = "Z3PynDHMJAcOPGDrzwmX4PH3g";

const SOCRATA = "https://data.cityofnewyork.us/resource/";
const DATASETS = {
  legacy: "3h2n-5cm9", // DOB Violations (older civil penalties, BIS)
  safety: "855j-jady", // DOB Safety Violations (newer, DOB NOW)
  ecb:    "6bgk-3dad"  // DOB ECB Violations (OATH/ECB summonses)
};
const GEO = "https://geosearch.planninglabs.nyc/v2/";

// Ownership comes from two different places, and they answer different questions.
// PLUTO gives the tax-lot owner of record — usually an LLC, sometimes just a name.
// HPD registration gives the people and companies legally responsible for a
// residential building, with the business addresses where notices are mailed.
const OWNER = {
  pluto:         "64uk-42ks", // Primary Land Use Tax Lot Output — ownername by BBL
  registrations: "tesw-yqqr", // HPD Multiple Dwelling Registrations — BIN to registration id
  contacts:      "feu5-w2e2"  // HPD Registration Contacts — names and mailing addresses
};
const BIS = "https://a810-bisweb.nyc.gov/bisweb/";
const DOBNOW_PORTAL = "https://a810-dobnow.nyc.gov/publish/Index.html#!/";

const $ = s => document.querySelector(s);

// If anything throws where no handler catches it, say so. A dead page with no
// explanation is the single hardest bug to report second-hand.
function fatal(message) {
  const el = document.getElementById("fatal");
  if (!el) return;
  el.style.display = "block";
  el.textContent = "Something went wrong: " + message +
    " — try a different browser, or open the console (F12) for detail.";
}
window.addEventListener("error", e => fatal(e.message || "script error"));
window.addEventListener("unhandledrejection", e => fatal(e.reason?.message || String(e.reason)));

// ---------------------------------------------------------------------------
// SAVED BUILDINGS
// ---------------------------------------------------------------------------
// Where the list lives depends on how this file is opened. A sandboxed preview
// may expose window.storage and block localStorage; a local file is the
// reverse. Try both, and fall back to memory so the feature still works for the
// current session rather than throwing.
const Saved = (() => {
  const KEY = "saved-buildings";
  let cache = [];
  let memory = null;

  async function readRaw() {
    try { if (window.storage) { const r = await window.storage.get(KEY, false); return r ? r.value : null; } } catch {}
    try { const v = localStorage.getItem(KEY); if (v !== null) return v; } catch {}
    return memory;
  }
  async function writeRaw(value) {
    memory = value;
    try { if (window.storage) { await window.storage.set(KEY, value, false); return; } } catch {}
    try { localStorage.setItem(KEY, value); } catch {}
  }
  async function persist() { await writeRaw(JSON.stringify(cache)); paintCount(); }

  return {
    async load() {
      const raw = await readRaw();
      try { cache = raw ? JSON.parse(raw) : []; } catch { cache = []; }
      if (!Array.isArray(cache)) cache = [];
      paintCount();
      return cache;
    },
    list()      { return cache; },
    has(bin)    { return cache.some(x => x.bin === bin); },
    get(bin)    { return cache.find(x => x.bin === bin); },
    async add(b) {
      if (cache.some(x => x.bin === b.bin)) return;
      cache.unshift({ bin: b.bin, bbl: b.bbl || "", label: b.label, savedAt: Date.now() });
      await persist();
    },
    /** Merge fields into one saved building and write to storage. */
    async update(bin, patch) {
      const entry = cache.find(x => x.bin === bin);
      if (!entry) return;
      Object.assign(entry, patch);
      await persist();
    },
    async remove(bin) {
      cache = cache.filter(x => x.bin !== bin);
      await persist();
    },
    async toggle(b) {
      if (this.has(b.bin)) await this.remove(b.bin);
      else await this.add(b);
      return this.has(b.bin);
    }
  };
})();

function paintCount() {
  const el = $("#savedCount");
  if (!el) return;
  const n = Saved.list().length;
  el.textContent = n;
  el.dataset.n = n;

  // A separate dot for "something changed", so the count still means count.
  const btn = $("#openSaved");
  const changed = changedCount();
  btn.classList.toggle("alerting", changed > 0);
  let dot = btn.querySelector(".alertdot");
  if (changed > 0) {
    if (!dot) {
      dot = document.createElement("span");
      dot.className = "alertdot";
      btn.appendChild(dot);
    }
    dot.textContent = changed + " updated";
  } else if (dot) {
    dot.remove();
  }
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sq  = s => String(s).replace(/'/g, "''");   // escape for SoQL string literals

// ---------------------------------------------------------------------------
// Plumbing: bounded concurrency + a paging Socrata client
// ---------------------------------------------------------------------------
async function socrata(id, params) {
  const url = SOCRATA + id + ".json?" + new URLSearchParams(params);
  // Only pass an options object when there is actually a header to send — fewer
  // arguments to serialize when fetch is proxied through postMessage.
  const call = APP_TOKEN
    ? fetch(url, { headers: { "X-App-Token": APP_TOKEN } })
    : fetch(url);

  let r;
  try {
    r = await Promise.race([call, timeoutAfter(20000)]);
  } catch (err) {
    if (err.message === "Request timed out") throw err;
    if (err instanceof TypeError) throw new Error("Could not reach NYC Open Data — network blocked or offline");
    throw new Error(err.message || "Request failed");
  }
  if (!r.ok) {
    throw new Error(r.status === 429
      ? "NYC Open Data rate limit reached — add a free app token at the top of this file"
      : `NYC Open Data returned ${r.status}`);
  }
  return r.json();
}

// Keep asking for pages until one comes back short. Paging needs a stable sort
// or rows repeat between pages, so we order by the system id and re-sort for
// display afterwards.
async function socrataAll(id, params, { pageSize = 1000, cap = 10000 } = {}) {
  const rows = [];
  let offset = 0;
  rows.truncated = false;
  for (;;) {
    const page = await socrata(id, { ...params, $order: ":id", $limit: pageSize, $offset: offset });
    rows.push(...page);
    if (page.length < pageSize) break;
    offset += pageSize;
    if (rows.length >= cap) { rows.truncated = true; break; }
  }
  return rows;
}

const input = $("#q"), box = $("#suggest"), busy = $("#busy"),
      goBtn = $("#go"), msgBox = $("#searchMsg"), clearBtn = $("#clearSearch");
let matches = [], active = -1, timer, seq = 0;
let cameFromSaved = false;   // so a record opened from the folder can offer a way back

// Wipe everything back to a blank slate.
function clearSearch() {
  clearTimeout(timer);
  seq++;                         // any in-flight response is now stale and ignored
  input.value = "";
  busy.hidden = true;
  goBtn.disabled = false;
  closeList();
  clearMessage();
  $("#out").innerHTML = "";
  document.body.classList.remove("has-result", "view-saved", "view-record");
  cameFromSaved = false;
  paintClear();
  window.scrollTo({ top: 0, behavior: "smooth" });
  input.focus();
}

// Nothing to clear on an already-empty page, so say so rather than offering a
// button that does nothing.
function paintClear() {
  clearBtn.disabled = !input.value.trim() && !$("#out").innerHTML && msgBox.hidden;
}

clearBtn.addEventListener("click", clearSearch);
input.addEventListener("input", paintClear);
paintClear();

function showMessage(html) { msgBox.innerHTML = html; msgBox.hidden = false; paintClear(); }
function clearMessage()   { msgBox.hidden = true; msgBox.innerHTML = ""; paintClear(); }

// Timeout via Promise.race rather than AbortController.
// In sandboxed frames fetch is proxied to the parent through postMessage, which
// structured-clones its arguments — and AbortSignal is not cloneable, so passing
// one throws DataCloneError before the request is ever sent. Racing a timer
// needs nothing but plain values, so it works natively and proxied alike.
// Tradeoff: a timed-out request is abandoned, not cancelled.
function timeoutAfter(ms) {
  return new Promise((_, reject) =>
    setTimeout(() => reject(new Error("Request timed out")), ms));
}

async function fetchJSON(url, { timeout = 12000 } = {}) {
  let r;
  try {
    r = await Promise.race([fetch(url), timeoutAfter(timeout)]);
  } catch (err) {
    if (err.message === "Request timed out") throw err;
    // A blocked or offline fetch throws a bare TypeError with no useful detail.
    if (err instanceof TypeError) throw new Error("Could not reach the server — network blocked or offline");
    throw new Error(err.message || "Request failed");
  }
  if (!r.ok) throw new Error(`Server returned ${r.status}${r.status === 429 ? " (rate limited)" : ""}`);
  return r.json();
}

// ---- typing opens the list -------------------------------------------------
input.addEventListener("input", () => {
  clearTimeout(timer);
  const text = input.value.trim();
  if (text.length < 3) { clearMessage(); return closeList(); }
  timer = setTimeout(() => lookup(text), 200);
});

input.addEventListener("keydown", e => {
  if (box.hidden || !matches.length) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    return;
  }
  if (e.key === "ArrowDown")    { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter")   { e.preventDefault(); choose(active < 0 ? 0 : active); }
  else if (e.key === "Escape")  { closeList(); }
});

goBtn.addEventListener("click", () => {
  // The button takes the highlighted row if the list is open, otherwise it
  // resolves whatever is typed.
  if (!box.hidden && matches.length) choose(active < 0 ? 0 : active);
  else submit();
});

function move(step) {
  active = (active + step + matches.length) % matches.length;
  paintActive();
  box.children[active]?.scrollIntoView({ block: "nearest" });
}
function paintActive() {
  [...box.children].forEach((el, i) => el.setAttribute("aria-selected", i === active));
}

function toBuilding(f) {
  const p = f.properties;
  return {
    label: p.label,
    house: p.housenumber || (p.label || "").match(/^[\d-]+/)?.[0] || "",
    street: (p.label || "").replace(/^[\d-]+\s+/, "").split(",")[0],
    borough: p.borough || p.locality || "",
    bin: p.addendum.pad.bin,
    bbl: p.addendum.pad.bbl
  };
}

async function geocode(text, endpoint) {
  const data = await fetchJSON(GEO + endpoint + "?text=" + encodeURIComponent(text) + "&size=12");
  return (data.features || []).filter(f => f.properties?.addendum?.pad?.bin).map(toBuilding);
}

// Never fail silently: an unreachable geocoder used to look identical to
// "no such address", which left people typing into a dead box.
function reportFailure(err, retryFn) {
  console.error("Address lookup failed:", err);
  showMessage(`<strong>Address search is unavailable.</strong>
    <span class="reason">${esc(err.message)}</span>
    <button class="dob" id="retrySearch">Try again</button>`);
  const retry = $("#retrySearch");
  if (retry) retry.onclick = retryFn;
}

// ---- the dropdown ----------------------------------------------------------
async function lookup(text) {
  const mine = ++seq;
  busy.hidden = false;
  let found;
  try {
    found = await geocode(text, "autocomplete");
  } catch (err) {
    if (mine !== seq) return;
    busy.hidden = true;
    closeList();
    reportFailure(err, () => lookup(text));
    return;
  }
  if (mine !== seq) return;                    // a newer keystroke already won
  busy.hidden = true;
  clearMessage();

  matches = found.slice(0, 7);
  if (!matches.length) return closeList();

  active = -1;
  box.innerHTML = matches.map((m, i) =>
    `<button role="option" aria-selected="false" data-i="${i}">
       <span class="no">${esc(m.house)}</span>
       <span class="rest">${esc(m.street)}</span>
       <span class="boro">${esc(m.borough)}</span>
     </button>`).join("");
  [...box.children].forEach((el, i) => {
    el.onclick = () => choose(i);
    el.onmouseenter = () => { active = i; paintActive(); };
  });
  box.hidden = false;
  input.setAttribute("aria-expanded", "true");
}

function choose(i) {
  const m = matches[i];
  if (!m) return;
  input.value = m.label;
  closeList();
  clearMessage();
  loadBuilding(m);
}

function closeList() {
  box.hidden = true;
  input.setAttribute("aria-expanded", "false");
  matches = []; active = -1;
}

document.addEventListener("click", e => { if (!e.target.closest(".placard")) closeList(); });

// ---- pressing Search / Enter with no list open ------------------------------
async function submit() {
  const text = input.value.trim();
  if (text.length < 3) {
    return showMessage(`<strong>Type an address to search.</strong>
      <span class="reason">House number and street, for example 20 Exchange Place.</span>`);
  }
  const mine = ++seq;
  clearMessage();
  busy.hidden = false;
  goBtn.disabled = true;

  let hits;
  try {
    // /search rather than /autocomplete: this is a complete address, not a prefix.
    hits = await geocode(text, "search");
  } catch (err) {
    if (mine !== seq) return;
    busy.hidden = true; goBtn.disabled = false;
    reportFailure(err, submit);
    return;
  }
  if (mine !== seq) return;
  busy.hidden = true; goBtn.disabled = false;

  if (!hits.length) {
    return showMessage(`<strong>No NYC building matches that address.</strong>
      <span class="reason">Check the spelling, or add the borough — for example "5 Avenue, Brooklyn".</span>`);
  }
  input.value = hits[0].label;
  closeList();
  loadBuilding(hits[0]);
}

async function loadBuilding(b) {
  document.body.classList.add("has-result", "view-record");
  document.body.classList.remove("view-saved");
  paintClear();
  $("#out").innerHTML = `
    <div class="navbar">
      <button class="dob" id="backHomeRec">← Home</button>
      ${cameFromSaved ? `<button class="dob" id="backSaved">← Saved buildings</button>` : ""}
    </div>
    <div class="loading">
      <strong>${esc(b.label)}</strong>
      <div class="muted" style="font-size:12px">BIN ${esc(b.bin)} — pulling every record on file…</div>
      <div class="bar"><i></i></div>
    </div>`;

  wireRecordNav();

  const where = `bin='${sq(b.bin)}'`;
  const ids = [DATASETS.legacy, DATASETS.safety, DATASETS.ecb];
  const settled = await Promise.allSettled(
    ids.map(id => socrataAll(id, { $where: where }))
  );

  // A rejected query must not masquerade as a building with no violations.
  const errors = [];
  const [legacy, safety, ecb] = settled.map((s, i) => {
    if (s.status === "fulfilled") return s.value;
    console.error("Dataset " + ids[i] + " failed:", s.reason);
    errors.push({ id: ids[i], message: s.reason?.message || String(s.reason) });
    const empty = []; empty.failed = true;
    return empty;
  });

  if (errors.length === ids.length) {
    $("#out").innerHTML = `
      <div class="navbar">
      <button class="dob" id="backHomeRec">← Home</button>
      ${cameFromSaved ? `<button class="dob" id="backSaved">← Saved buildings</button>` : ""}
    </div>
      <div class="loading">
        <strong>Could not load records for ${esc(b.label)}.</strong>
        <div class="muted" style="font-size:12px;margin-top:6px">${esc(errors[0].message)}</div>
        <div class="actions"><button class="dob" id="retryBuilding">Try again</button></div>
      </div>`;
    wireRecordNav();
    $("#retryBuilding").onclick = () => loadBuilding(b);
    return;
  }

  render(b, { legacy, safety, ecb }, errors);

  // Fired after the violations render rather than awaited alongside them, so a
  // slow ownership query never delays the thing people came for.
  fetchOwnership(b.bin, b.bbl)
    .then(o => renderOwnership(o, b.bin))
    .catch(err => {
      console.error("ownership failed:", err);
      renderOwnership({ plutoOwner: null, contacts: [], registration: null, failed: true }, b.bin);
    });
  $("#out").scrollIntoView({ behavior: "smooth", block: "start" });
}

const pick = (row, ...keys) => keys.map(k => row[k]).find(v => v != null && v !== "");

function normalize(row, source, bin) {
  const status = (pick(row, "violation_category", "ecb_violation_status", "violation_status") || "").toUpperCase();
  const isOpen = /^V\*|ACTIVE|OPEN/.test(status) && !/RESOLVE|DISMISS|CURED|CLOSED/.test(status);
  const raw = pick(row, "issue_date", "violation_date", "served_date");
  return {
    source, bin,
    isn: String(pick(row, "isn_dob_bis_viol", "isn_dob_bis_extract") || "").padStart(10, "0"),
    ecbNumber: pick(row, "ecb_violation_number", "ecb_number"),
    number: pick(row, "number", "violation_number", "ecb_violation_number", "isn_dob_bis_viol") || "—",
    sortKey: sortableDate(raw),
    date:   fmt(raw),
    type:   pick(row, "violation_type", "violation_category", "infraction_code_description") || "",
    desc:   pick(row, "description", "violation_description", "novdescription") || "",
    cls:    pick(row, "severity", "violation_class", "class") || "",
    money:  pick(row, "balance_due", "penality_imposed", "amount_paid"),
    status, isOpen
  };
}

// Dates arrive as YYYYMMDD in some datasets and ISO in others.
function sortableDate(d) {
  if (!d) return "";
  const s = String(d);
  if (/^\d{8}$/.test(s)) return s;
  const t = new Date(s);
  return isNaN(t) ? s : t.toISOString().slice(0, 10).replace(/-/g, "");
}
function fmt(d) {
  if (!d) return "";
  const s = String(d);
  if (/^\d{8}$/.test(s)) return `${s.slice(4,6)}/${s.slice(6,8)}/${s.slice(0,4)}`;
  const t = new Date(s);
  return isNaN(t) ? s : t.toLocaleDateString("en-US");
}

// ---------------------------------------------------------------------------
// Is the owner a person or a company?
// ---------------------------------------------------------------------------
// PLUTO gives one free-text name with no type field, so this is inference.
// Order matters: check for organisation words first, because plenty of
// companies are named after the person who founded them ("SMITH REALTY LLC"
// would otherwise read as a person).
const PUBLIC_WORDS = new RegExp("\\b(" + [
  "CITY OF NEW YORK","NEW YORK CITY","NYC","NYCHA","HOUSING AUTHORITY","STATE OF NEW YORK",
  "DEPT","DEPARTMENT","AUTHORITY","BOARD OF EDUCATION","MTA","PORT AUTHORITY","MUNICIPAL"
].join("|") + ")\\b");

const COMPANY_WORDS = new RegExp("\\b(" + [
  "LLC","L L C","INC","INCORPORATED","CORP","CORPORATION","CO","COMPANY","LP","LLP","LTD",
  "REALTY","REALTIES","PROPERTIES","PROPERTY","ASSOCIATES","ASSOC","PARTNERS","PARTNERSHIP",
  "HOLDINGS","HOLDING","MANAGEMENT","MGMT","GROUP","ENTERPRISES","DEVELOPMENT","DEVELOPERS",
  "EQUITIES","INVESTORS","INVESTMENT","INVESTMENTS","VENTURES","CAPITAL","FUND","TRUST",
  "ESTATES","BUILDERS","CONSTRUCTION","APARTMENTS","APTS","HOUSING","HDFC","COOP","CO-OP",
  "CONDOMINIUM","CONDO","CHURCH","SYNAGOGUE","TEMPLE","MOSQUE","FOUNDATION","SOCIETY",
  "HOSPITAL","UNIVERSITY","COLLEGE","SCHOOL","CENTER","CENTRE","INSTITUTE","ASSOCIATION",
  "TENANTS","OWNERS","MANOR","TOWERS","PLAZA","GARDENS","HOUSE"
].join("|") + ")\\b");

function classifyOwner(name) {
  const n = (name || "").toUpperCase().replace(/[.]/g, "").replace(/\s+/g, " ").trim();
  if (!n) return "";
  if (PUBLIC_WORDS.test(n)) return "public";
  if (COMPANY_WORDS.test(n)) return "company";

  // PLUTO writes individuals as "LASTNAME, FIRSTNAME" more often than not.
  if (/^[A-Z][A-Z'\-]+,\s*[A-Z]/.test(n)) return "person";

  // Otherwise: a short run of name-like words, allowing joint owners.
  const words = n.replace(/&|\bAND\b/g, " ").split(/\s+/).filter(Boolean);
  const nameish = words.every(w => /^[A-Z][A-Z'\-]*$/.test(w));
  if (nameish && words.length >= 2 && words.length <= 5) return "person";

  return "";   // genuinely unclear — never guess
}

const OWNER_KIND_LABEL = { person: "Individual", company: "Company", public: "Public/institution" };

// Unknown year sorts last in both directions, like the other missing stats.
function year(b) {
  const y = b.facts?.yearBuilt;
  return y || (sortKey === "age_old" ? 99999 : -1);
}

// PLUTO owner strings are inconsistent — spacing, punctuation, and the legal
// suffix all vary between lots owned by the same entity. Normalise for grouping
// but show the original.
function ownerKey(b) {
  const raw = (b.facts?.ownerName || "").toUpperCase();
  if (!raw) return "";
  return raw
    .replace(/[.,]/g, " ")
    .replace(/\b(LLC|L L C|INC|CORP|CO|LP|LLP|REALTY|ASSOCIATES|ASSOC|PARTNERS|HOLDINGS|MANAGEMENT|MGMT)\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function groupByOwner(list) {
  const groups = new Map();
  for (const b of list) {
    const key = ownerKey(b) || "\u0000unknown";
    if (!groups.has(key)) {
      groups.set(key, { name: b.facts?.ownerName || "Owner not on file", items: [] });
    }
    groups.get(key).items.push(b);
  }
  // Biggest portfolios first; unknown owners last regardless of size.
  return [...groups.entries()]
    .sort((a, b) => {
      if (a[0] === "\u0000unknown") return 1;
      if (b[0] === "\u0000unknown") return -1;
      return b[1].items.length - a[1].items.length;
    })
    .map(([, g]) => g);
}

// Sort on the street first, so "12 Ash St" and "400 Ash St" sit together rather
// than being separated by every address that happens to start with a 2.
function addrKey(b) {
  const label = b.label || "";
  const street = label.replace(/^[\d-]+\s+/, "").toUpperCase();
  const house = parseInt(label, 10);
  return street + " " + String(isNaN(house) ? 0 : house).padStart(6, "0");
}

// Unchecked buildings have no stats. Give them a value that sorts to the bottom
// in either direction rather than randomly landing at the top.
const num = (b, key) => b.stats ? (b.stats[key] ?? 0) : -1;
const dateKey = (b, key) => (b.stats && b.stats[key]) || "";

// No "all" entry: no active filters IS all. Filters combine with AND, so
// "Company owner" plus "Has open" narrows to both.
const FILTERS = {
  open:    { label: "Has open",   fn: b => num(b, "open") > 0 },
  clean:   { label: "None open",  fn: b => Boolean(b.stats) && b.stats.open === 0 },
  updated: { label: "Updated",    fn: b => !b.seen && hasChanges(b.changes) },
  person:  { label: "Individual owner", fn: b => ownerKind(b) === "person" },
  company: { label: "Company owner",    fn: b => ownerKind(b) === "company" }
};

// HPD states the owner type outright (IndividualOwner / CorporateOwner), so when
// a record has been opened and that is known, it overrides the guess from the name.
function ownerKind(b) {
  return b.hpdOwnerKind || b.facts?.ownerKind || "";
}

const DEFAULT_SORT = "saved";
let sortKey = DEFAULT_SORT;
let activeFilters = new Set();
let groupOwner = false;

const viewIsDefault = () =>
  sortKey === DEFAULT_SORT && activeFilters.size === 0 && !groupOwner;

// Remember the choice between visits \u2014 it is a preference, not state.
try {
  const pref = JSON.parse(localStorage.getItem("saved-view") || "{}");
  if (SORTS[pref.sort]) sortKey = pref.sort;
  if (Array.isArray(pref.filters)) {
    activeFilters = new Set(pref.filters.filter(k => FILTERS[k]));
  }
  groupOwner = Boolean(pref.group);
} catch {}

function saveViewPref() {
  try {
    localStorage.setItem("saved-view",
      JSON.stringify({ sort: sortKey, filters: [...activeFilters], group: groupOwner }));
  } catch {}
}

function arrangeSaved(list) {
  let out = list;
  for (const key of activeFilters) out = out.filter(FILTERS[key].fn);
  return [...out].sort(SORTS[sortKey].fn);
}

function resetView() {
  sortKey = DEFAULT_SORT;
  activeFilters.clear();
  groupOwner = false;
  saveViewPref();
  showSaved();
}

// Plain-language description of what is currently on screen.
function viewDescription(shown, total) {
  const bits = [];
  if (activeFilters.size) bits.push([...activeFilters].map(k => FILTERS[k].label).join(" + "));
  if (sortKey !== DEFAULT_SORT) bits.push("by " + SORTS[sortKey].label.toLowerCase());
  if (groupOwner) bits.push("grouped by owner");
  const what = shown === total
    ? `${total} building${total === 1 ? "" : "s"}`
    : `${shown} of ${total}`;
  return bits.length ? `${what} \u00b7 ${bits.join(" \u00b7 ")}` : what;
}

function statLine(b) {
  if (!b.stats) return b.checkedAt ? "no data yet" : "not checked yet";
  const bits = [b.stats.total + " total"];
  if (b.stats.open) bits.push(b.stats.open + " open");
  if (b.stats.lastIssue) bits.push("latest " + fmt(b.stats.lastIssue));
  if (b.facts?.yearBuilt) bits.push("built " + b.facts.yearBuilt);
  return bits.join(" \u00b7 ");
}

function savedCard(s) {
  return `
    <div class="saved-item ${!s.seen && hasChanges(s.changes) ? "changed" : ""}" data-bin="${esc(s.bin)}">
      <button class="open">
        <span class="addr">${esc(s.label)}</span>
        ${changeSummary(s) ? `<span class="changepill">${esc(changeSummary(s))}</span>` : ""}
        <span class="sub">${esc(statLine(s))}${ownerKind(s)
          ? ` \u00b7 <span class="kind ${ownerKind(s)}">${esc(OWNER_KIND_LABEL[ownerKind(s)])}</span>` : ""}</span>
        <span class="sub dim">BIN ${esc(s.bin)}${s.checkedAt
          ? " \u00b7 checked " + esc(new Date(s.checkedAt).toLocaleDateString("en-US")) : ""}</span>
      </button>
      <button class="drop" title="Remove from saved" aria-label="Remove ${esc(s.label)}">\u2715</button>
    </div>`;
}

function groupsHtml(list) {
  return groupByOwner(list).map(g => `
    <div class="ownergroup">
      <div class="ownerhead">
        <span class="ownerhead-name">${esc(g.name)}</span>
        <span class="ownerhead-n">${g.items.length} building${g.items.length === 1 ? "" : "s"}</span>
      </div>
      ${g.items.map(savedCard).join("")}
    </div>`).join("");
}

function showSaved() {
  // A page of its own: the hero and the whole search apparatus are hidden, so
  // there is nothing here but the buildings.
  document.body.classList.add("has-result", "view-saved");
  document.body.classList.remove("view-record");
  clearMessage();
  paintClear();
  const all = Saved.list();
  const list = arrangeSaved(all);

  $("#out").innerHTML = `
    <div class="folder">
      <div class="navbar">
        <button class="dob" id="backHome">← Back to search</button>
        <button class="dob" id="checkNow">Check for updates now</button>
      </div>
      <div class="head">
        <h2>Saved buildings</h2>
      </div>

      <div class="sortbar">
        <label class="sortlab" for="sortSel">Sort</label>
        <select id="sortSel" class="sortsel">
          ${Object.entries(SORTS).map(([k, v]) =>
            `<option value="${k}" ${k === sortKey ? "selected" : ""}>${esc(v.label)}</option>`).join("")}
        </select>
        <span class="sortlab">Show</span>
        <div class="chips">
          ${Object.entries(FILTERS).map(([k, v]) =>
            `<button class="fchip ${activeFilters.has(k) ? "on" : ""}" data-filter="${k}"
                     aria-pressed="${activeFilters.has(k)}">${esc(v.label)}</button>`).join("")}
        </div>
        <button class="fchip ${groupOwner ? "on" : ""}" id="groupToggle">Group by owner</button>
      </div>

      <div class="viewbar ${viewIsDefault() ? "" : "active"}">
        <span class="viewdesc">${esc(viewDescription(list.length, all.length))}</span>
        ${viewIsDefault() ? "" : `<button class="clearview" id="resetView">✕ Clear filters</button>`}
      </div>
      ${list.length ? (groupOwner ? groupsHtml(list) : list.map(savedCard).join(""))
      : all.length
        ? `<div class="empty">No saved buildings match this filter.
           <button class="authlink" data-filter="all">Show all</button></div>`
        : `<div class="empty">Nothing saved yet. Go back, look up a building and hit
           <strong>Save building</strong> to keep it here.</div>`}
    </div>`;

  $("#backHome").onclick = goHome;
  const check = $("#checkNow");
  check.onclick = async () => {
    check.disabled = true;
    check.textContent = "Checking…";
    await checkSavedBuildings({ force: true });
    // showSaved has re-rendered by now if anything changed; guard the stale node.
    const btn = $("#checkNow");
    if (btn) { btn.disabled = false; btn.textContent = "Check for updates now"; }
  };
  const sel = $("#sortSel");
  if (sel) sel.onchange = () => { sortKey = sel.value; saveViewPref(); showSaved(); };
  const gt = $("#groupToggle");
  if (gt) gt.onclick = () => { groupOwner = !groupOwner; saveViewPref(); showSaved(); };
  document.querySelectorAll("[data-filter]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.filter;
      if (k === "__clear") activeFilters.clear();
      else if (activeFilters.has(k)) activeFilters.delete(k);
      else activeFilters.add(k);
      saveViewPref();
      showSaved();          // re-renders immediately, so the bar updates on the spot
    };
  });
  const rv = $("#resetView");
  if (rv) rv.onclick = resetView;

  window.scrollTo({ top: 0, behavior: "smooth" });

  document.querySelectorAll(".saved-item").forEach(el => {
    const bin = el.dataset.bin;
    const entry = list.find(s => s.bin === bin);
    el.querySelector(".open").onclick = () => { cameFromSaved = true; loadBuilding(entry); };
    el.querySelector(".drop").onclick = async () => { await Saved.remove(bin); showSaved(); };
  });
}

// The record nav is re-rendered on every state change, so its handlers are
// re-attached rather than bound once.
function wireRecordNav() {
  const home = $("#backHomeRec");
  if (home) home.onclick = goHome;
  const back = $("#backSaved");
  if (back) back.onclick = showSaved;
}

function goHome() {
  cameFromSaved = false;
  document.body.classList.remove("has-result", "view-saved", "view-record");
  $("#out").innerHTML = "";
  input.value = "";
  closeList();
  clearMessage();
  paintClear();
  window.scrollTo({ top: 0, behavior: "smooth" });
  input.focus();
}

$("#openSaved").onclick = showSaved;
$("#goHome").onclick = goHome;

// Check saved buildings in the background on every visit. Deliberately not
// awaited: the page is usable immediately and badges appear as results land.
Saved.load().then(() => checkSavedBuildings());

// ---------------------------------------------------------------------------
// CHANGE DETECTION
// ---------------------------------------------------------------------------
// Each saved building keeps a signature: every violation number mapped to 1 for
// open or 0 for closed. Comparing signatures rather than counts is what makes
// this trustworthy — DOB amends records constantly, so a building can gain one
// violation and resolve another and the total never moves.

const CHECK_EVERY_MS = 12 * 60 * 60 * 1000;  // NYC Open Data refreshes ~daily
const SIG_CAP = 3000;                        // keep storage bounded on huge buildings

async function violationSignature(bin) {
  const ids = [DATASETS.legacy, DATASETS.safety, DATASETS.ecb];
  const sources = ["DOB", "SAFETY", "ECB"];
  const settled = await Promise.allSettled(
    ids.map(id => socrataAll(id, { $where: `bin='${sq(bin)}'` }, { pageSize: 1000, cap: SIG_CAP }))
  );

  // If every dataset failed we know nothing — recording an empty signature would
  // make the next check report every violation as brand new.
  if (settled.every(s => s.status === "rejected")) {
    throw new Error(settled[0].reason?.message || "Check failed");
  }
  // A partial failure is just as dangerous: the missing dataset's violations
  // would look resolved. Better to skip this round and try later.
  if (settled.some(s => s.status === "rejected")) {
    throw new Error("Some datasets did not respond");
  }

  const sig = {};
  // Gathered on the same pass, since we already have every row in hand.
  const stats = { total: 0, open: 0, lastIssue: "", lastResolved: "" };

  settled.forEach((s, i) => {
    for (const row of s.value) {
      const v = normalize(row, sources[i], bin);
      if (!v.number || v.number === "—") continue;

      // A violation can appear in more than one dataset; count it once.
      if (!(v.number in sig)) {
        stats.total++;
        if (v.isOpen) stats.open++;
      }
      sig[v.number] = v.isOpen ? 1 : 0;

      if (v.sortKey > stats.lastIssue) stats.lastIssue = v.sortKey;

      // Only the legacy dataset carries a disposition date, so "last resolved"
      // is best-effort rather than complete.
      if (!v.isOpen) {
        const d = sortableDate(pick(row, "disposition_date", "certification_date"));
        if (d && d > stats.lastResolved) stats.lastResolved = d;
      }
    }
  });
  return { sig, stats };
}

function diffSignatures(before, after) {
  const added = [], resolved = [], reopened = [];
  for (const num of Object.keys(after)) {
    if (!(num in before)) added.push(num);
    else if (before[num] === 1 && after[num] === 0) resolved.push(num);
    else if (before[num] === 0 && after[num] === 1) reopened.push(num);
  }
  return { added, resolved, reopened };
}

const hasChanges = c => Boolean(c && (c.added?.length || c.resolved?.length || c.reopened?.length));

// Age and owner come from PLUTO, keyed on BBL. Fetched alongside the violation
// check rather than on demand, so sorting and grouping work without opening
// every building first.
async function fetchLotFacts(bbl) {
  if (!bbl) return null;
  const rows = await socrata(OWNER.pluto, {
    bbl,
    $select: "ownername, yearbuilt, unitsres, bldgclass, numfloors",
    $limit: 1
  });
  const r = rows[0];
  if (!r) return null;
  const year = parseInt(r.yearbuilt, 10);
  return {
    // PLUTO writes 0 for unknown rather than leaving it blank.
    yearBuilt: year > 1600 ? year : null,
    ownerName: (r.ownername || "").trim(),
    unitsRes: parseInt(r.unitsres, 10) || 0,
    bldgClass: r.bldgclass || "",
    floors: parseFloat(r.numfloors) || 0,
    ownerKind: classifyOwner(r.ownername)
  };
}

/**
 * Walk the saved list and refresh anything stale. Runs in the background on
 * load — never blocks the page, and updates badges as each building finishes.
 */
async function checkSavedBuildings({ force = false } = {}) {
  const due = Saved.list().filter(b =>
    force || !b.checkedAt || Date.now() - b.checkedAt > CHECK_EVERY_MS);
  if (!due.length) return;

  // Two at a time. Each building is three paged queries, and without a token
  // everyone shares one anonymous rate limit.
  let next = 0;
  const worker = async () => {
    while (next < due.length) {
      const entry = due[next++];
      try {
        const { sig, stats } = await violationSignature(entry.bin);
        // A missing lot record should not sink the whole check.
        const facts = await fetchLotFacts(entry.bbl).catch(err => {
          console.warn("lot facts for " + entry.bin + ":", err.message);
          return entry.facts || null;
        });
        const first = !entry.sig;                       // baseline, not news
        const changes = first ? null : diffSignatures(entry.sig, sig);

        await Saved.update(entry.bin, {
          sig,
          stats,
          facts: facts || entry.facts || null,
          checkedAt: Date.now(),
          // Keep unseen changes from a previous visit rather than overwriting
          // them — otherwise opening the site twice erases the alert.
          changes: hasChanges(changes) ? changes : (entry.seen ? null : entry.changes || null),
          seen: hasChanges(changes) ? false : entry.seen
        });
        refreshChangeUI();
      } catch (err) {
        console.warn("check failed for BIN " + entry.bin + ":", err.message);
        // Deliberately not stamping checkedAt: a failed check should retry,
        // not be treated as a clean result for the next 12 hours.
      }
    }
  };
  await Promise.all([worker(), worker()]);
}

/** Total buildings with unseen changes. */
function changedCount() {
  return Saved.list().filter(b => !b.seen && hasChanges(b.changes)).length;
}

function changeSummary(b) {
  if (b.seen || !hasChanges(b.changes)) return "";
  const parts = [];
  if (b.changes.added?.length)    parts.push(`${b.changes.added.length} new`);
  if (b.changes.resolved?.length) parts.push(`${b.changes.resolved.length} resolved`);
  if (b.changes.reopened?.length) parts.push(`${b.changes.reopened.length} reopened`);
  return parts.join(" · ");
}

// Repaint whatever view is currently showing, without disturbing the user.
function refreshChangeUI() {
  paintCount();
  if (document.body.classList.contains("view-saved")) showSaved();
}


// Simple filters (?bbl=X) rather than $where, because these columns are numeric
// in some datasets and text in others, and a quoted $where fails against a
// numeric column.
async function fetchOwnership(bin, bbl) {
  const out = { plutoOwner: null, contacts: [], registration: null, failed: false };

  const jobs = [
    // Tax-lot owner. Needs BBL, which not every geocode result carries.
    bbl ? socrata(OWNER.pluto, { bbl,
            $select: "ownername, address, bldgclass, unitsres, unitstotal, yearbuilt, yearalter1, numfloors, lotarea, bldgarea",
            $limit: 1 })
        : Promise.resolve([]),
    // HPD registration is keyed on BIN. Newest first: buildings re-register
    // annually and old rows stay in the dataset.
    socrata(OWNER.registrations, { bin, $order: "lastregistrationdate DESC", $limit: 1 })
  ];

  const [pluto, regs] = (await Promise.allSettled(jobs)).map(r => {
    if (r.status === "fulfilled") return r.value;
    console.warn("ownership lookup:", r.reason);
    out.failed = true;
    return [];
  });

  if (pluto[0]) {
    out.plutoOwner = pluto[0];
    // Render the age strip as soon as the lot record lands, without waiting for
    // the two chained HPD calls that follow.
    renderFacts(pluto[0]);
  }

  // Contacts hang off the registration, so this second call can only happen
  // once we have a registration id.
  if (regs[0]?.registrationid) {
    out.registration = regs[0];
    try {
      out.contacts = await socrata(OWNER.contacts, {
        registrationid: regs[0].registrationid,
        $limit: 50
      });
    } catch (err) {
      console.warn("contacts lookup:", err);
      out.failed = true;
    }
  }
  return out;
}

// Building class codes are two characters; the first letter is the useful part.
const CLASS_FAMILY = {
  A: "One-family home", B: "Two-family home", C: "Walk-up apartments",
  D: "Elevator apartments", E: "Warehouse", F: "Factory / industrial",
  G: "Garage / gas", H: "Hotel", I: "Health facility", J: "Theatre",
  K: "Store", L: "Loft", M: "Religious", N: "Asylum / home", O: "Office",
  P: "Public assembly", Q: "Recreation", R: "Condominium", S: "Mixed residential/commercial",
  T: "Transportation", U: "Utility", V: "Vacant land", W: "Educational", Y: "Government", Z: "Misc."
};

function renderFacts(p) {
  const el = $("#bfacts");
  if (!el || !p) return;

  const year = parseInt(p.yearbuilt, 10);
  // PLUTO writes 0 when the year is unknown rather than leaving it empty.
  const built = year > 1600 ? year : null;
  const age = built ? new Date().getFullYear() - built : null;
  const altered = parseInt(p.yearalter1, 10);
  const floors = parseFloat(p.numfloors) || 0;
  const units = parseInt(p.unitstotal, 10) || 0;
  const res = parseInt(p.unitsres, 10) || 0;

  const tiles = [
    built && { k: "Built", v: built, sub: age === 0 ? "this year" : age + " year" + (age === 1 ? "" : "s") + " old" },
    altered > 1600 && { k: "Last altered", v: altered },
    floors && { k: "Floors", v: floors % 1 ? floors : Math.round(floors) },
    units && { k: "Units", v: units, sub: res ? res + " residential" : "no residential" },
    p.bldgclass && { k: "Class " + p.bldgclass, v: CLASS_FAMILY[p.bldgclass[0]] || "\u2014", wide: true }
  ].filter(Boolean);

  if (!tiles.length) return;

  el.innerHTML = tiles.map(t => `
    <div class="bfact ${t.wide ? "wide" : ""}">
      <span class="bfact-v">${esc(t.v)}</span>
      <span class="bfact-k">${esc(t.k)}</span>
      ${t.sub ? `<span class="bfact-s">${esc(t.sub)}</span>` : ""}
    </div>`).join("");
}

function contactName(c) {
  const person = [c.firstname, c.lastname].filter(Boolean).join(" ").trim();
  // Corporate owners have no personal name; individual owners have no company.
  return c.corporationname?.trim() || person || "";
}

function contactAddress(c) {
  const street = [c.businesshousenumber, c.businessstreetname].filter(Boolean).join(" ").trim();
  const apt = c.businessapartment ? `Apt ${c.businessapartment}` : "";
  const cityLine = [c.businesscity, c.businessstate].filter(Boolean).join(", ");
  const full = [street, apt, cityLine, c.businesszip].filter(Boolean).join(", ");
  return full || "";
}

// HPD uses terse role codes. Show what they mean.
const ROLE_LABEL = {
  HeadOfficer: "Head officer",
  IndividualOwner: "Individual owner",
  CorporateOwner: "Corporate owner",
  JointOwner: "Joint owner",
  SiteManager: "Site manager",
  Agent: "Managing agent",
  Officer: "Officer",
  Shareholder: "Shareholder",
  Lessee: "Lessee"
};

// Owners with a real stake come first; agents and managers after.
const ROLE_RANK = ["IndividualOwner", "CorporateOwner", "JointOwner", "HeadOfficer",
                   "Shareholder", "Officer", "Lessee", "Agent", "SiteManager"];

function renderOwnership(o, bin) {
  const el = $("#ownership");
  if (!el) return;

  // HPD names the owner type explicitly, so upgrade the saved building's guess
  // whenever we happen to have the real answer in hand.
  if (bin && Saved.has(bin) && o.contacts.length) {
    const types = o.contacts.map(c => c.type);
    const kind = types.includes("IndividualOwner") ? "person"
               : types.includes("CorporateOwner") ? "company" : "";
    if (kind && Saved.get(bin)?.hpdOwnerKind !== kind) Saved.update(bin, { hpdOwnerKind: kind });
  }

  if (!o.plutoOwner && !o.contacts.length) {
    el.innerHTML = `<h3 class="section">Ownership<span>${o.failed ? "unavailable" : "nothing on file"}</span></h3>
      <div class="empty">${o.failed
        ? "Ownership lookup failed. Reload to try again."
        : `No owner on record. HPD registration is only required for residential buildings
           with three or more units, or rented one- and two-family homes — so commercial
           buildings and owner-occupied houses often show nothing here.`}</div>`;
    return;
  }

  const sorted = [...o.contacts].sort((a, b) => {
    const ai = ROLE_RANK.indexOf(a.type), bi = ROLE_RANK.indexOf(b.type);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });

  // The same person often appears under several roles on one registration.
  const seen = new Set();
  const cards = sorted.filter(c => {
    const key = contactName(c) + "|" + contactAddress(c);
    if (!contactName(c) || seen.has(key)) return false;
    seen.add(key);
    return true;
  }).map(c => {
    const addr = contactAddress(c);
    return `<div class="owner">
      <div class="owner-top">
        <span class="owner-name">${esc(contactName(c))}</span>
        <span class="owner-role">${esc(ROLE_LABEL[c.type] || c.type || "Contact")}</span>
      </div>
      ${addr ? `<div class="owner-addr">${esc(addr)}</div>` : `<div class="owner-addr muted">No address on file</div>`}
    </div>`;
  }).join("");

  const p = o.plutoOwner;
  const reg = o.registration;

  el.innerHTML = `
    <h3 class="section">Ownership<span>${cards ? sorted.length + " contacts" : "tax records only"}</span></h3>

    ${p ? `<div class="owner lot">
      <div class="owner-top">
        <span class="owner-name">${esc(p.ownername || "Not listed")}</span>
        <span class="owner-role">Owner of record</span>
      </div>
      <div class="owner-addr muted">
        ${[p.bldgclass ? "Class " + esc(p.bldgclass) : "",
           p.unitsres ? esc(p.unitsres) + " residential units" : "",
           p.yearbuilt && p.yearbuilt !== "0" ? "Built " + esc(p.yearbuilt) : ""
          ].filter(Boolean).join(" · ")}
      </div>
    </div>` : ""}

    ${cards || ""}

    ${reg ? `<p class="note">HPD registration last filed
      ${esc(fmt(reg.lastregistrationdate))}${reg.registrationenddate
        ? `, expires ${esc(fmt(reg.registrationenddate))}` : ""}.</p>` : ""}

    <p class="note">Owner of record is the tax-lot owner from city land records and is often a
    holding company. The contacts below it are who HPD holds responsible for the building.
    Addresses are business mailing addresses filed with the city; for small buildings that is
    sometimes the owner's home. Public record, but worth using accordingly.</p>`;
}


function dobLink(v) {
  if (v.source === "DOB" && v.isn && v.number !== "—") {
    return { label: "Open in BIS", href: BIS + "ActionViolationDisplayServlet?" + new URLSearchParams({
      requestid: "1", allbin: v.bin, allinquirytype: "BXS3OCV4", allisn: v.isn, ppremise60: v.number }) };
  }
  if (v.source === "ECB" && v.ecbNumber) {
    return { label: "Open in BIS", href: BIS + "ECBQueryByNumberServlet?" + new URLSearchParams({
      allbin: v.bin, ecbin: v.ecbNumber, requestid: "3" }) };
  }
  if (v.source === "SAFETY") return { href: DOBNOW_PORTAL, label: "Open DOB NOW", paste: true };
  return null;
}

function rowHtml(v) {
  const cls = v.cls?.toString().startsWith("1") ? "c1" : v.cls?.toString().startsWith("2") ? "c2" : "";
  const link = dobLink(v);
  const flag = !recordChanges ? ""
    : recordChanges.added?.includes(v.number)    ? `<span class="flag new">New</span>`
    : recordChanges.reopened?.includes(v.number) ? `<span class="flag new">Reopened</span>`
    : recordChanges.resolved?.includes(v.number) ? `<span class="flag done">Resolved</span>` : "";
  const actions = link ? `
    <div class="actions">
      <a class="dob" href="${link.href}" target="_blank" rel="noopener">${link.label}</a>
      <button class="dob" data-copy="${esc(v.number)}">Copy number</button>
      ${link.paste ? `<span class="why">DOB NOW has no direct link — paste the number into Violation Search.</span>` : ""}
    </div>` : "";

  return `<div class="row ${cls} ${v.isOpen ? "open" : ""}">
    <div class="top">
      ${flag}
      <span class="num">${esc(v.number)}</span>
      <span class="muted">${esc(v.date)}</span>
      ${v.type ? `<span class="muted">${esc(v.type)}</span>` : ""}
      ${v.status ? `<span class="pill ${v.isOpen ? "open" : "closed"}">${esc(v.status)}</span>` : ""}
      ${v.money ? `<span class="muted">$${esc(v.money)}</span>` : ""}
    </div>
    ${v.desc ? `<div class="desc">${esc(v.desc)}</div>` : ""}
    ${actions}
  </div>`;
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-copy]");
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(btn.dataset.copy);
    const original = btn.textContent;
    btn.textContent = "Copied";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1400);
  } catch { btn.textContent = "Press Ctrl+C"; }
});
</script>
</body>
