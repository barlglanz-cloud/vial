<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Record — NYC violation lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181C; --paper:#EFF0F2; --card:#FFFFFF; --rule:#C9CCD1;
    --permit:#E5006D; --permit-soft:#FFF0F6;
    --class1:#C81E1E; --class2:#B26A00; --class3:#5B6068; --ok:#15704A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* faint blueprint grid */
    background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
    background-size:28px 28px;
    background-position:-1px -1px;
  }
  body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.86;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 20px 90px}

  /* ---------- hero ---------- */
  .hero{padding:min(16vh,120px) 0 0;transition:padding .35s ease}
  body.has-result .hero{padding:26px 0 0}

  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#7A7F87;margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--permit)}

  .hero h1{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.01em;line-height:.92;margin:0;
    font-size:clamp(42px,9vw,86px);
  }
  .hero h1 em{font-style:normal;color:var(--permit)}
  .hero .lede{
    max-width:52ch;margin:18px 0 0;font-size:14px;color:#4A4F57;
  }
  body.has-result .hero h1{font-size:clamp(24px,4vw,32px)}
  body.has-result .hero .lede,
  body.has-result .hero .eyebrow,
  body.has-result .searchmsg:empty,

  /* ---------- the placard: search ---------- */
  .placard{margin:34px 0 0;border:2px solid var(--ink);background:var(--card);box-shadow:6px 6px 0 rgba(22,24,28,.10)}
  body.has-result .placard{margin-top:20px;box-shadow:none}
  .placard .strip{
    background:var(--permit);color:#fff;padding:7px 14px;
    font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .placard .strip span:last-child{opacity:.8}

  .field{display:flex;align-items:center;gap:14px;padding:4px 6px 4px 18px}
  .field svg{flex:none;color:#9AA0A8}
  .field:focus-within svg{color:var(--permit)}
  input{
    flex:1;min-width:0;width:100%;padding:20px 0;font:inherit;font-size:17px;letter-spacing:.01em;
    background:transparent;border:0;color:var(--ink);
  }
  .go{
    flex:none;font-family:'Archivo',sans-serif;font-weight:800;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;padding:14px 22px;margin:0;cursor:pointer;
    background:var(--ink);color:#fff;border:0;
  }
  .go:hover,.go:focus{background:var(--permit);outline:none}
  .go:disabled{background:var(--rule);color:#8A8F97;cursor:default}
  @media (max-width:520px){
    .field{flex-wrap:wrap;padding:4px 6px 6px 14px}
    input{padding:14px 0}
    .go{width:100%;padding:13px}
  }
  input::placeholder{color:#A9AEB5}
  input:focus{outline:none}
  .field{border-top:2px solid transparent}
  .placard:focus-within{box-shadow:6px 6px 0 var(--permit)}
  body.has-result .placard:focus-within{box-shadow:4px 4px 0 var(--permit)}
  .spinner{width:15px;height:15px;border:2px solid var(--rule);border-top-color:var(--permit);border-radius:50%;
           animation:spin .7s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- suggestions ---------- */
  .suggest{border-top:1.5px solid var(--ink);max-height:330px;overflow:auto}
  .suggest[hidden]{display:none}
  .suggest button{
    display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
    padding:12px 18px;font:inherit;background:none;border:0;border-bottom:1px solid var(--rule);cursor:pointer;
  }
  .suggest button:last-child{border-bottom:0}
  .suggest button .no{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;min-width:56px}
  .suggest button .rest{flex:1;color:#4A4F57}
  .suggest button .boro{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9AA0A8}
  .suggest button[aria-selected="true"]{background:var(--permit);color:#fff}
  .suggest button[aria-selected="true"] .rest,
  .suggest button[aria-selected="true"] .boro{color:#FFD9EA}

  /* ---------- saved buildings as its own page ---------- */
  body.view-saved .hero,
  body.view-record .hero{display:none}
  body.view-saved #openSaved{display:none}
  body.view-saved .wrap,
  body.view-record .wrap{padding-top:0}
  .navbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .backbtn{margin-bottom:18px}

  /* ---------- inline search feedback ---------- */
  .searchtools{display:flex;justify-content:flex-end;margin-top:10px}
  .clear{
    font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:7px;padding:6px 11px;cursor:pointer;
    background:none;border:1px solid var(--rule);color:#8A8F97;
  }
  .clear::before{content:"✕";font-size:11px;letter-spacing:0}
  .clear:hover,.clear:focus{border-color:var(--permit);color:var(--permit);outline:none}
  .clear:disabled{opacity:.4;cursor:default;border-color:var(--rule);color:#B4B8BE}
  .searchmsg{margin-top:12px;border:1.5px solid var(--class2);background:#FFF8EC;color:#7A5300;
             padding:12px 14px;font-size:13px;line-height:1.6}
  .searchmsg[hidden]{display:none}
  .searchmsg strong{display:block}
  .searchmsg .reason{display:block;color:#9A7430;font-size:12px;margin:2px 0 10px}

  /* ---------- results ---------- */
  .building{background:var(--card);border:2px solid var(--ink);padding:16px 18px;margin:26px 0 0}
  .building h2{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:22px;margin:0 0 10px}
  .ids{display:flex;flex-wrap:wrap;gap:18px;font-size:12px}
  .ids b{display:block;font-size:10px;letter-spacing:.12em;color:#8A8F97;font-weight:500}

  .tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .tile{background:var(--card);border:2px solid var(--ink);padding:12px 14px}
  .tile .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:32px;line-height:1}
  .tile .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8A8F97;margin-top:4px}

  h3.section{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:15px;
             margin:32px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink);
             display:flex;justify-content:space-between;align-items:baseline}
  h3.section span{font-family:'IBM Plex Mono';font-size:11px;color:#8A8F97;letter-spacing:0}

  .row{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--class3);padding:11px 14px;margin-bottom:6px}
  .row.c1{border-left-color:var(--class1)}
  .row.c2{border-left-color:var(--class2)}
  .row.open{border-left-width:8px}
  .row .top{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;font-size:12px}
  .row .num{font-weight:600}
  .row .desc{margin-top:5px;font-size:13px}
  .pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor}
  .pill.open{color:var(--class1)}
  .pill.closed{color:var(--ok)}
  .muted{color:#8A8F97}

  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  a.dob,button.dob{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 9px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);
    text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  a.dob:hover,button.dob:hover,a.dob:focus,button.dob:focus{background:var(--permit);border-color:var(--permit);color:#fff;outline:none}
  a.dob::after{content:"↗";font-size:12px}
  button.dob.copied{background:var(--ok);border-color:var(--ok);color:#fff}
  .actions .why{font-size:11px;color:#9AA0A8;text-transform:none;letter-spacing:0}
  .building .actions{margin-top:14px}

  /* ---------- top bar + saved folder ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;
          padding:14px 0 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
  .topbar .mark{color:#9AA0A8;cursor:pointer;background:none;border:0;font:inherit;letter-spacing:.18em;padding:0}
  .topbar .mark:hover{color:var(--permit)}
  .savedbtn{font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;
    background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
  .savedbtn:hover,.savedbtn:focus{border-color:var(--permit);color:var(--permit);outline:none}
  .savedbtn .badge{background:var(--permit);color:#fff;padding:1px 6px;font-family:'Archivo',sans-serif;
                   font-weight:800;letter-spacing:0;font-size:11px}
  .savedbtn .badge[data-n="0"]{background:var(--rule);color:#6B7078}

  button.save{border-color:var(--ink)}
  button.save.on{background:var(--permit);border-color:var(--permit);color:#fff}
  button.save::after{content:none}

  .folder{margin-top:26px}
  .folder .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
                border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
  .folder h2{font-family:'Archivo Narrow',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:24px;margin:0}
  .saved-item{display:flex;align-items:center;gap:12px;background:var(--card);
              border:1px solid var(--rule);border-left:5px solid var(--permit);padding:12px 14px;margin-bottom:6px}
  .saved-item .open{flex:1;text-align:left;font:inherit;background:none;border:0;cursor:pointer;padding:0}
  .saved-item .open:hover .addr,.saved-item .open:focus .addr{color:var(--permit);outline:none}
  .saved-item .addr{font-weight:600;font-size:15px;display:block}
  .saved-item .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9AA0A8}
  .saved-item .drop{font:inherit;font-size:16px;line-height:1;background:none;border:0;cursor:pointer;
                    color:#B4B8BE;padding:4px 6px}
  .saved-item .drop:hover,.saved-item .drop:focus{color:var(--class1);outline:none}

  .empty.warn{border-color:var(--class2);border-style:solid;border-left-width:4px;color:#7A5300;background:#FFF8EC}
  #fatal{display:none;background:var(--class1);color:#fff;padding:12px 16px;font-size:13px;line-height:1.6;margin-top:14px}

  .status{margin-top:24px;font-size:12px;color:#8A8F97;line-height:1.7}
  .empty{background:var(--card);border:1px dashed var(--rule);padding:14px;font-size:13px;color:#666}
  .note{font-size:12px;color:#8A8F97;margin-top:10px}
  .warn{border-left:4px solid var(--class2);padding-left:10px}
  .loading{margin-top:26px;border:2px solid var(--ink);background:var(--card);padding:16px 18px}
  .bar{height:4px;background:var(--rule);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;width:35%;background:var(--permit);animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}

  @media (prefers-reduced-motion:reduce){
    .bar i,.spinner{animation:none}
    .hero{transition:none}
  }
  @media (prefers-reduced-motion:no-preference){
    .row{animation:in .18s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(3px)}}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="fatal" role="alert"></div>

  <div class="topbar">
    <button class="mark" id="goHome">Building Record</button>
    <button class="savedbtn" id="openSaved">Saved buildings <span class="badge" id="savedCount" data-n="0">0</span></button>
  </div>

  <div class="hero">
    <div class="eyebrow">NYC Open Data · Department of Buildings</div>
    <h1>Look up any<br>building's <em>violations</em></h1>
    <p class="lede">Type an address. You get every DOB violation, safety violation and OATH/ECB
      summons on file for that building — with a link straight to the record on the city's own site.</p>

    <div class="placard">
      <div class="strip">
        <span>Public record lookup</span>
        <span>BIS · DOB NOW · OATH</span>
      </div>
      <div class="field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path>
        </svg>
        <input id="q" type="text" autocomplete="off" spellcheck="false"
               placeholder="Enter a full address, e.g. 20 Exchange Place"
               aria-label="Building address"
               role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <div id="busy" hidden class="spinner" aria-hidden="true"></div>
        <button class="go" id="go">Search</button>
      </div>
      <div id="suggest" class="suggest" role="listbox" aria-label="Matching addresses" hidden></div>
    </div>

    <div class="searchtools">
      <button class="clear" id="clearSearch">Clear search</button>
    </div>

    <div id="searchMsg" class="searchmsg" role="status" hidden></div>
  </div>

  <div id="out"></div>

</div>

<script>
// ---------------------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------------------
// Free Socrata app token: https://data.cityofnewyork.us/profile/edit/developer_settings
const APP_TOKEN = "";

const SOCRATA = "https://data.cityofnewyork.us/resource/";
const DATASETS = {
  legacy: "3h2n-5cm9", // DOB Violations (older civil penalties, BIS)
  safety: "855j-jady", // DOB Safety Violations (newer, DOB NOW)
  ecb:    "6bgk-3dad"  // DOB ECB Violations (OATH/ECB summonses)
};
const GEO = "https://geosearch.planninglabs.nyc/v2/";
const BIS = "https://a810-bisweb.nyc.gov/bisweb/";
const DOBNOW_PORTAL = "https://a810-dobnow.nyc.gov/publish/Index.html#!/";

const $ = s => document.querySelector(s);

// If anything throws where no handler catches it, say so. A dead page with no
// explanation is the single hardest bug to report second-hand.
function fatal(message) {
  const el = document.getElementById("fatal");
  if (!el) return;
  el.style.display = "block";
  el.textContent = "Something went wrong: " + message +
    " — try a different browser, or open the console (F12) for detail.";
}
window.addEventListener("error", e => fatal(e.message || "script error"));
window.addEventListener("unhandledrejection", e => fatal(e.reason?.message || String(e.reason)));

// ---------------------------------------------------------------------------
// SAVED BUILDINGS
// ---------------------------------------------------------------------------
// Where the list lives depends on how this file is opened. A sandboxed preview
// may expose window.storage and block localStorage; a local file is the
// reverse. Try both, and fall back to memory so the feature still works for the
// current session rather than throwing.
const Saved = (() => {
  const KEY = "saved-buildings";
  let cache = [];
  let memory = null;

  async function readRaw() {
    try { if (window.storage) { const r = await window.storage.get(KEY, false); return r ? r.value : null; } } catch {}
    try { const v = localStorage.getItem(KEY); if (v !== null) return v; } catch {}
    return memory;
  }
  async function writeRaw(value) {
    memory = value;
    try { if (window.storage) { await window.storage.set(KEY, value, false); return; } } catch {}
    try { localStorage.setItem(KEY, value); } catch {}
  }
  async function persist() { await writeRaw(JSON.stringify(cache)); paintCount(); }

  return {
    async load() {
      const raw = await readRaw();
      try { cache = raw ? JSON.parse(raw) : []; } catch { cache = []; }
      if (!Array.isArray(cache)) cache = [];
      paintCount();
      return cache;
    },
    list()      { return cache; },
    has(bin)    { return cache.some(x => x.bin === bin); },
    async add(b) {
      if (cache.some(x => x.bin === b.bin)) return;
      cache.unshift({ bin: b.bin, bbl: b.bbl || "", label: b.label, savedAt: Date.now() });
      await persist();
    },
    async remove(bin) {
      cache = cache.filter(x => x.bin !== bin);
      await persist();
    },
    async toggle(b) {
      if (this.has(b.bin)) await this.remove(b.bin);
      else await this.add(b);
      return this.has(b.bin);
    }
  };
})();

function paintCount() {
  const el = $("#savedCount");
  if (!el) return;
  const n = Saved.list().length;
  el.textContent = n;
  el.dataset.n = n;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sq  = s => String(s).replace(/'/g, "''");   // escape for SoQL string literals

// ---------------------------------------------------------------------------
// Plumbing: bounded concurrency + a paging Socrata client
// ---------------------------------------------------------------------------
async function socrata(id, params) {
  const url = SOCRATA + id + ".json?" + new URLSearchParams(params);
  // Only pass an options object when there is actually a header to send — fewer
  // arguments to serialize when fetch is proxied through postMessage.
  const call = APP_TOKEN
    ? fetch(url, { headers: { "X-App-Token": APP_TOKEN } })
    : fetch(url);

  let r;
  try {
    r = await Promise.race([call, timeoutAfter(20000)]);
  } catch (err) {
    if (err.message === "Request timed out") throw err;
    if (err instanceof TypeError) throw new Error("Could not reach NYC Open Data — network blocked or offline");
    throw new Error(err.message || "Request failed");
  }
  if (!r.ok) {
    throw new Error(r.status === 429
      ? "NYC Open Data rate limit reached — add a free app token at the top of this file"
      : `NYC Open Data returned ${r.status}`);
  }
  return r.json();
}

// Keep asking for pages until one comes back short. Paging needs a stable sort
// or rows repeat between pages, so we order by the system id and re-sort for
// display afterwards.
async function socrataAll(id, params, { pageSize = 1000, cap = 10000 } = {}) {
  const rows = [];
  let offset = 0;
  rows.truncated = false;
  for (;;) {
    const page = await socrata(id, { ...params, $order: ":id", $limit: pageSize, $offset: offset });
    rows.push(...page);
    if (page.length < pageSize) break;
    offset += pageSize;
    if (rows.length >= cap) { rows.truncated = true; break; }
  }
  return rows;
}

// ---------------------------------------------------------------------------
// SEARCH — addresses only
// ---------------------------------------------------------------------------
const input = $("#q"), box = $("#suggest"), busy = $("#busy"),
      goBtn = $("#go"), msgBox = $("#searchMsg"), clearBtn = $("#clearSearch");
let matches = [], active = -1, timer, seq = 0;
let cameFromSaved = false;   // so a record opened from the folder can offer a way back

// Wipe everything back to a blank slate.
function clearSearch() {
  clearTimeout(timer);
  seq++;                         // any in-flight response is now stale and ignored
  input.value = "";
  busy.hidden = true;
  goBtn.disabled = false;
  closeList();
  clearMessage();
  $("#out").innerHTML = "";
  document.body.classList.remove("has-result", "view-saved", "view-record");
  cameFromSaved = false;
  paintClear();
  window.scrollTo({ top: 0, behavior: "smooth" });
  input.focus();
}

// Nothing to clear on an already-empty page, so say so rather than offering a
// button that does nothing.
function paintClear() {
  clearBtn.disabled = !input.value.trim() && !$("#out").innerHTML && msgBox.hidden;
}

clearBtn.addEventListener("click", clearSearch);
input.addEventListener("input", paintClear);
paintClear();

function showMessage(html) { msgBox.innerHTML = html; msgBox.hidden = false; paintClear(); }
function clearMessage()   { msgBox.hidden = true; msgBox.innerHTML = ""; paintClear(); }

// Timeout via Promise.race rather than AbortController.
// In sandboxed frames fetch is proxied to the parent through postMessage, which
// structured-clones its arguments — and AbortSignal is not cloneable, so passing
// one throws DataCloneError before the request is ever sent. Racing a timer
// needs nothing but plain values, so it works natively and proxied alike.
// Tradeoff: a timed-out request is abandoned, not cancelled.
function timeoutAfter(ms) {
  return new Promise((_, reject) =>
    setTimeout(() => reject(new Error("Request timed out")), ms));
}

async function fetchJSON(url, { timeout = 12000 } = {}) {
  let r;
  try {
    r = await Promise.race([fetch(url), timeoutAfter(timeout)]);
  } catch (err) {
    if (err.message === "Request timed out") throw err;
    // A blocked or offline fetch throws a bare TypeError with no useful detail.
    if (err instanceof TypeError) throw new Error("Could not reach the server — network blocked or offline");
    throw new Error(err.message || "Request failed");
  }
  if (!r.ok) throw new Error(`Server returned ${r.status}${r.status === 429 ? " (rate limited)" : ""}`);
  return r.json();
}

// ---- typing opens the list -------------------------------------------------
input.addEventListener("input", () => {
  clearTimeout(timer);
  const text = input.value.trim();
  if (text.length < 3) { clearMessage(); return closeList(); }
  timer = setTimeout(() => lookup(text), 200);
});

input.addEventListener("keydown", e => {
  if (box.hidden || !matches.length) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
    return;
  }
  if (e.key === "ArrowDown")    { e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter")   { e.preventDefault(); choose(active < 0 ? 0 : active); }
  else if (e.key === "Escape")  { closeList(); }
});

goBtn.addEventListener("click", () => {
  // The button takes the highlighted row if the list is open, otherwise it
  // resolves whatever is typed.
  if (!box.hidden && matches.length) choose(active < 0 ? 0 : active);
  else submit();
});

function move(step) {
  active = (active + step + matches.length) % matches.length;
  paintActive();
  box.children[active]?.scrollIntoView({ block: "nearest" });
}
function paintActive() {
  [...box.children].forEach((el, i) => el.setAttribute("aria-selected", i === active));
}

function toBuilding(f) {
  const p = f.properties;
  return {
    label: p.label,
    house: p.housenumber || (p.label || "").match(/^[\d-]+/)?.[0] || "",
    street: (p.label || "").replace(/^[\d-]+\s+/, "").split(",")[0],
    borough: p.borough || p.locality || "",
    bin: p.addendum.pad.bin,
    bbl: p.addendum.pad.bbl
  };
}

async function geocode(text, endpoint) {
  const data = await fetchJSON(GEO + endpoint + "?text=" + encodeURIComponent(text) + "&size=12");
  return (data.features || []).filter(f => f.properties?.addendum?.pad?.bin).map(toBuilding);
}

// Never fail silently: an unreachable geocoder used to look identical to
// "no such address", which left people typing into a dead box.
function reportFailure(err, retryFn) {
  console.error("Address lookup failed:", err);
  showMessage(`<strong>Address search is unavailable.</strong>
    <span class="reason">${esc(err.message)}</span>
    <button class="dob" id="retrySearch">Try again</button>`);
  const retry = $("#retrySearch");
  if (retry) retry.onclick = retryFn;
}

// ---- the dropdown ----------------------------------------------------------
async function lookup(text) {
  const mine = ++seq;
  busy.hidden = false;
  let found;
  try {
    found = await geocode(text, "autocomplete");
  } catch (err) {
    if (mine !== seq) return;
    busy.hidden = true;
    closeList();
    reportFailure(err, () => lookup(text));
    return;
  }
  if (mine !== seq) return;                    // a newer keystroke already won
  busy.hidden = true;
  clearMessage();

  matches = found.slice(0, 7);
  if (!matches.length) return closeList();

  active = -1;
  box.innerHTML = matches.map((m, i) =>
    `<button role="option" aria-selected="false" data-i="${i}">
       <span class="no">${esc(m.house)}</span>
       <span class="rest">${esc(m.street)}</span>
       <span class="boro">${esc(m.borough)}</span>
     </button>`).join("");
  [...box.children].forEach((el, i) => {
    el.onclick = () => choose(i);
    el.onmouseenter = () => { active = i; paintActive(); };
  });
  box.hidden = false;
  input.setAttribute("aria-expanded", "true");
}

function choose(i) {
  const m = matches[i];
  if (!m) return;
  input.value = m.label;
  closeList();
  clearMessage();
  loadBuilding(m);
}

function closeList() {
  box.hidden = true;
  input.setAttribute("aria-expanded", "false");
  matches = []; active = -1;
}

document.addEventListener("click", e => { if (!e.target.closest(".placard")) closeList(); });

// ---- pressing Search / Enter with no list open ------------------------------
async function submit() {
  const text = input.value.trim();
  if (text.length < 3) {
    return showMessage(`<strong>Type an address to search.</strong>
      <span class="reason">House number and street, for example 20 Exchange Place.</span>`);
  }
  const mine = ++seq;
  clearMessage();
  busy.hidden = false;
  goBtn.disabled = true;

  let hits;
  try {
    // /search rather than /autocomplete: this is a complete address, not a prefix.
    hits = await geocode(text, "search");
  } catch (err) {
    if (mine !== seq) return;
    busy.hidden = true; goBtn.disabled = false;
    reportFailure(err, submit);
    return;
  }
  if (mine !== seq) return;
  busy.hidden = true; goBtn.disabled = false;

  if (!hits.length) {
    return showMessage(`<strong>No NYC building matches that address.</strong>
      <span class="reason">Check the spelling, or add the borough — for example "5 Avenue, Brooklyn".</span>`);
  }
  input.value = hits[0].label;
  closeList();
  loadBuilding(hits[0]);
}

// ---------------------------------------------------------------------------
// BUILDING RECORD
// ---------------------------------------------------------------------------
async function loadBuilding(b) {
  document.body.classList.add("has-result", "view-record");
  document.body.classList.remove("view-saved");
  paintClear();
  $("#out").innerHTML = `
    <div class="navbar">
      <button class="dob" id="backHomeRec">← Home</button>
      ${cameFromSaved ? `<button class="dob" id="backSaved">← Saved buildings</button>` : ""}
    </div>
    <div class="loading">
      <strong>${esc(b.label)}</strong>
      <div class="muted" style="font-size:12px">BIN ${esc(b.bin)} — pulling every record on file…</div>
      <div class="bar"><i></i></div>
    </div>`;

  wireRecordNav();

  const where = `bin='${sq(b.bin)}'`;
  const ids = [DATASETS.legacy, DATASETS.safety, DATASETS.ecb];
  const settled = await Promise.allSettled(
    ids.map(id => socrataAll(id, { $where: where }))
  );

  // A rejected query must not masquerade as a building with no violations.
  const errors = [];
  const [legacy, safety, ecb] = settled.map((s, i) => {
    if (s.status === "fulfilled") return s.value;
    console.error("Dataset " + ids[i] + " failed:", s.reason);
    errors.push({ id: ids[i], message: s.reason?.message || String(s.reason) });
    const empty = []; empty.failed = true;
    return empty;
  });

  if (errors.length === ids.length) {
    $("#out").innerHTML = `
      <div class="navbar">
      <button class="dob" id="backHomeRec">← Home</button>
      ${cameFromSaved ? `<button class="dob" id="backSaved">← Saved buildings</button>` : ""}
    </div>
      <div class="loading">
        <strong>Could not load records for ${esc(b.label)}.</strong>
        <div class="muted" style="font-size:12px;margin-top:6px">${esc(errors[0].message)}</div>
        <div class="actions"><button class="dob" id="retryBuilding">Try again</button></div>
      </div>`;
    wireRecordNav();
    $("#retryBuilding").onclick = () => loadBuilding(b);
    return;
  }

  render(b, { legacy, safety, ecb }, errors);
  $("#out").scrollIntoView({ behavior: "smooth", block: "start" });
}

const pick = (row, ...keys) => keys.map(k => row[k]).find(v => v != null && v !== "");

function normalize(row, source, bin) {
  const status = (pick(row, "violation_category", "ecb_violation_status", "violation_status") || "").toUpperCase();
  const isOpen = /^V\*|ACTIVE|OPEN/.test(status) && !/RESOLVE|DISMISS|CURED|CLOSED/.test(status);
  const raw = pick(row, "issue_date", "violation_date", "served_date");
  return {
    source, bin,
    isn: String(pick(row, "isn_dob_bis_viol", "isn_dob_bis_extract") || "").padStart(10, "0"),
    ecbNumber: pick(row, "ecb_violation_number", "ecb_number"),
    number: pick(row, "number", "violation_number", "ecb_violation_number", "isn_dob_bis_viol") || "—",
    sortKey: sortableDate(raw),
    date:   fmt(raw),
    type:   pick(row, "violation_type", "violation_category", "infraction_code_description") || "",
    desc:   pick(row, "description", "violation_description", "novdescription") || "",
    cls:    pick(row, "severity", "violation_class", "class") || "",
    money:  pick(row, "balance_due", "penality_imposed", "amount_paid"),
    status, isOpen
  };
}

// Dates arrive as YYYYMMDD in some datasets and ISO in others.
function sortableDate(d) {
  if (!d) return "";
  const s = String(d);
  if (/^\d{8}$/.test(s)) return s;
  const t = new Date(s);
  return isNaN(t) ? s : t.toISOString().slice(0, 10).replace(/-/g, "");
}
function fmt(d) {
  if (!d) return "";
  const s = String(d);
  if (/^\d{8}$/.test(s)) return `${s.slice(4,6)}/${s.slice(6,8)}/${s.slice(0,4)}`;
  const t = new Date(s);
  return isNaN(t) ? s : t.toLocaleDateString("en-US");
}

function render(b, sets, errors = []) {
  const byDate = (x, y) => (y.sortKey || "").localeCompare(x.sortKey || "");
  const all = [
    ...sets.legacy.map(r => normalize(r, "DOB", b.bin)),
    ...sets.safety.map(r => normalize(r, "SAFETY", b.bin)),
    ...sets.ecb.map(r => normalize(r, "ECB", b.bin))
  ].sort(byDate);
  const open = all.filter(v => v.isOpen).length;
  const anyTruncated = [sets.legacy, sets.safety, sets.ecb].some(s => s.truncated);

  const section = (title, list, failed) => `
    <h3 class="section">${title}<span>${failed ? "unavailable" : list.length + " record" + (list.length === 1 ? "" : "s")}</span></h3>
    ${failed
      ? `<div class="empty warn">This dataset did not load, so its records are missing from the totals above.</div>`
      : list.length
        ? list.map(rowHtml).join("")
        : `<div class="empty">No records in this dataset for this building.</div>`}`;

  $("#out").innerHTML = `
    <div class="navbar">
      <button class="dob" id="backHomeRec">← Home</button>
      ${cameFromSaved ? `<button class="dob" id="backSaved">← Saved buildings</button>` : ""}
    </div>
    <div class="building">
      <h2>${esc(b.label)}</h2>
      <div class="ids">
        <div><b>BIN</b>${esc(b.bin)}</div>
        <div><b>BBL</b>${esc(b.bbl || "—")}</div>
      </div>
      <div class="actions">
        <button class="dob save ${Saved.has(b.bin) ? "on" : ""}" id="saveBtn">
          ${Saved.has(b.bin) ? "★ Saved" : "☆ Save building"}
        </button>
        <a class="dob" target="_blank" rel="noopener"
           href="${BIS}PropertyProfileOverviewServlet?bin=${encodeURIComponent(b.bin)}&requestid=2">BIS property profile</a>
        <a class="dob" target="_blank" rel="noopener" href="${DOBNOW_PORTAL}">DOB NOW portal</a>
      </div>
    </div>

    <div class="tally">
      <div class="tile"><div class="n">${all.length}</div><div class="k">Total on file</div></div>
      <div class="tile"><div class="n" style="color:var(--class1)">${open}</div><div class="k">Look open</div></div>
      <div class="tile"><div class="n">${sets.ecb.length}</div><div class="k">OATH / ECB</div></div>
    </div>

    ${errors.length ? `<p class="note warn"><strong>Incomplete.</strong> ${errors.length} of 3 datasets
      did not load (${esc(errors[0].message)}), so the counts above are lower than the real figure.</p>` : ""}

    ${anyTruncated ? `<p class="note warn">This building has more records than the 10,000-per-dataset ceiling.
      Raise the cap in socrataAll() to see the rest.</p>` : ""}

    ${section("DOB violations (BIS)", all.filter(v => v.source === "DOB"), sets.legacy.failed)}
    ${section("DOB safety violations (DOB NOW)", all.filter(v => v.source === "SAFETY"), sets.safety.failed)}
    ${section("OATH / ECB summonses", all.filter(v => v.source === "ECB"), sets.ecb.failed)}

    <p class="status"><strong>Unofficial.</strong> Data comes from NYC Open Data
    (${DATASETS.legacy}, ${DATASETS.safety}, ${DATASETS.ecb}) and can be incomplete or out of date.
    Some violations appear in more than one dataset, status fields are not always current, and records
    are sometimes filed under a different BIN than expected. This is a screening tool — for the official
    record, check BIS or DOB NOW using the links above. Not affiliated with the City of New York.</p>`;

  wireRecordNav();

  const save = $("#saveBtn");
  save.onclick = async () => {
    const on = await Saved.toggle(b);
    save.classList.toggle("on", on);
    save.textContent = on ? "★ Saved" : "☆ Save building";
  };
}

// ---------------------------------------------------------------------------
// THE FOLDER
// ---------------------------------------------------------------------------
function showSaved() {
  // A page of its own: the hero and the whole search apparatus are hidden, so
  // there is nothing here but the buildings.
  document.body.classList.add("has-result", "view-saved");
  document.body.classList.remove("view-record");
  clearMessage();
  paintClear();
  const list = Saved.list();

  $("#out").innerHTML = `
    <div class="folder">
      <button class="dob backbtn" id="backHome">← Back to search</button>
      <div class="head">
        <h2>Saved buildings</h2>
        <span class="muted" style="font-size:12px">${list.length} building${list.length === 1 ? "" : "s"}</span>
      </div>
      ${list.length ? list.map(s => `
        <div class="saved-item" data-bin="${esc(s.bin)}">
          <button class="open">
            <span class="addr">${esc(s.label)}</span>
            <span class="sub">BIN ${esc(s.bin)} · saved ${esc(new Date(s.savedAt).toLocaleDateString("en-US"))}</span>
          </button>
          <button class="drop" title="Remove from saved" aria-label="Remove ${esc(s.label)}">✕</button>
        </div>`).join("")
      : `<div class="empty">Nothing saved yet. Go back, look up a building and hit
         <strong>Save building</strong> to keep it here.</div>`}
    </div>`;

  $("#backHome").onclick = goHome;
  window.scrollTo({ top: 0, behavior: "smooth" });

  document.querySelectorAll(".saved-item").forEach(el => {
    const bin = el.dataset.bin;
    const entry = list.find(s => s.bin === bin);
    el.querySelector(".open").onclick = () => { cameFromSaved = true; loadBuilding(entry); };
    el.querySelector(".drop").onclick = async () => { await Saved.remove(bin); showSaved(); };
  });
}

// The record nav is re-rendered on every state change, so its handlers are
// re-attached rather than bound once.
function wireRecordNav() {
  const home = $("#backHomeRec");
  if (home) home.onclick = goHome;
  const back = $("#backSaved");
  if (back) back.onclick = showSaved;
}

function goHome() {
  cameFromSaved = false;
  document.body.classList.remove("has-result", "view-saved", "view-record");
  $("#out").innerHTML = "";
  input.value = "";
  closeList();
  clearMessage();
  paintClear();
  window.scrollTo({ top: 0, behavior: "smooth" });
  input.focus();
}

$("#openSaved").onclick = showSaved;
$("#goHome").onclick = goHome;

Saved.load();

// ---------------------------------------------------------------------------
// Deep links into DOB's own systems
// ---------------------------------------------------------------------------
function dobLink(v) {
  if (v.source === "DOB" && v.isn && v.number !== "—") {
    return { label: "Open in BIS", href: BIS + "ActionViolationDisplayServlet?" + new URLSearchParams({
      requestid: "1", allbin: v.bin, allinquirytype: "BXS3OCV4", allisn: v.isn, ppremise60: v.number }) };
  }
  if (v.source === "ECB" && v.ecbNumber) {
    return { label: "Open in BIS", href: BIS + "ECBQueryByNumberServlet?" + new URLSearchParams({
      allbin: v.bin, ecbin: v.ecbNumber, requestid: "3" }) };
  }
  if (v.source === "SAFETY") return { href: DOBNOW_PORTAL, label: "Open DOB NOW", paste: true };
  return null;
}

function rowHtml(v) {
  const cls = v.cls?.toString().startsWith("1") ? "c1" : v.cls?.toString().startsWith("2") ? "c2" : "";
  const link = dobLink(v);
  const actions = link ? `
    <div class="actions">
      <a class="dob" href="${link.href}" target="_blank" rel="noopener">${link.label}</a>
      <button class="dob" data-copy="${esc(v.number)}">Copy number</button>
      ${link.paste ? `<span class="why">DOB NOW has no direct link — paste the number into Violation Search.</span>` : ""}
    </div>` : "";

  return `<div class="row ${cls} ${v.isOpen ? "open" : ""}">
    <div class="top">
      <span class="num">${esc(v.number)}</span>
      <span class="muted">${esc(v.date)}</span>
      ${v.type ? `<span class="muted">${esc(v.type)}</span>` : ""}
      ${v.status ? `<span class="pill ${v.isOpen ? "open" : "closed"}">${esc(v.status)}</span>` : ""}
      ${v.money ? `<span class="muted">$${esc(v.money)}</span>` : ""}
    </div>
    ${v.desc ? `<div class="desc">${esc(v.desc)}</div>` : ""}
    ${actions}
  </div>`;
}

document.addEventListener("click", async e => {
  const btn = e.target.closest("button[data-copy]");
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(btn.dataset.copy);
    const original = btn.textContent;
    btn.textContent = "Copied";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1400);
  } catch { btn.textContent = "Press Ctrl+C"; }
});
</script>
